name: Release Standalone Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner: windows-latest
            platform: windows-x64
            binary: spinalml-windows-x64.exe
            archive: spinalml-windows-x64.zip

          - os: ubuntu-latest
            runner: ubuntu-latest
            platform: linux-x64
            binary: spinalml-linux-x64
            archive: spinalml-linux-x64.tar.gz

          - os: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
            platform: linux-arm64
            binary: spinalml-linux-arm64
            archive: spinalml-linux-arm64.tar.gz

          - os: macos-latest
            runner: macos-latest
            platform: darwin-arm64
            binary: spinalml-darwin-arm64
            archive: spinalml-darwin-arm64.tar.gz

          - os: macos-13
            runner: macos-13
            platform: darwin-x64
            binary: spinalml-darwin-x64
            archive: spinalml-darwin-x64.tar.gz

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # =========================================================================
      # 1. SETUP PYTHON & UV
      # =========================================================================
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup uv Package Manager
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv --python 3.12 .venv

      # =========================================================================
      # 2. INSTALL MINIMAL CLI DEPENDENCIES & PYINSTALLER
      # =========================================================================
      - name: Install Build Dependencies via uv
        run: |
          uv pip install --python .venv -r cli/requirements.txt pyinstaller

      # =========================================================================
      # 3. COMPILE STANDALONE EXECUTABLE WITH PYINSTALLER
      # =========================================================================
      - name: Build Standalone Binary
        run: |
          uv run --python .venv python cli/build_binary.py --name "${{ matrix.binary }}"

      # =========================================================================
      # 4. FAST SMOKE TESTS (< 1 MINUTE)
      # =========================================================================
      - name: Run Binary Smoke Tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.binary }}"
          echo "=== Testing --help ==="
          ./dist/${{ matrix.binary }} --help

          echo "=== Testing setup & tool download ==="
          ./dist/${{ matrix.binary }} setup

          echo "=== Testing compile on lightweight component ==="
          ./dist/${{ matrix.binary }} compile tests/universal/UniversalOpsDemo.scala -o smoke_rtl --no-chain

          echo "=== Testing Universal bit-exact verification under Verilator ==="
          ./dist/${{ matrix.binary }} test tests/universal/UniversalOpsDemo.scala

      - name: Run Binary Smoke Tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Testing --help ==="
          .\dist\${{ matrix.binary }} --help

          Write-Host "=== Testing setup & tool download ==="
          .\dist\${{ matrix.binary }} setup

          Write-Host "=== Testing compile on lightweight component ==="
          .\dist\${{ matrix.binary }} compile tests/universal/UniversalOpsDemo.scala -o smoke_rtl --no-chain

          Write-Host "=== Testing Universal bit-exact verification under Verilator ==="
          .\dist\${{ matrix.binary }} test tests/universal/UniversalOpsDemo.scala

      # =========================================================================
      # 5. PACKAGE ARCHIVE & GENERATE SHA256 CHECKSUM
      # =========================================================================
      - name: Create Archive & Compute SHA256 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          tar -czf "${{ matrix.archive }}" "${{ matrix.binary }}"
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          cat "${{ matrix.archive }}.sha256"

      - name: Create Archive & Compute SHA256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "dist/${{ matrix.archive }}" -Force
          $hash = (Get-FileHash -Path "dist/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -FilePath "dist/${{ matrix.archive }}.sha256" -Encoding ascii
          Get-Content "dist/${{ matrix.archive }}.sha256"

      # =========================================================================
      # 6. UPLOAD AS RELEASE ASSET (IF RELEASE EVENT)
      # =========================================================================
      - name: Upload to GitHub Release via GitHub CLI
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "dist/${{ matrix.archive }}" "dist/${{ matrix.archive }}.sha256" --clobber

      # =========================================================================
      # 7. UPLOAD AS ARTIFACT (IF WORKFLOW_DISPATCH)
      # =========================================================================
      - name: Upload Build Artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-binary
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
