name: CI - Hardware Simulations

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch: 

jobs:
  build:
    runs-on: [self-hosted, arm64, radxa]
    strategy:
      fail-fast: false
      matrix:
        test_group: [
          "ops",
          "layers",
          "examples",
          "activations poolings",
          "accelerator interfaces tensors"
        ]
    steps:
      - uses: actions/checkout@v4

      - name: Check and Install System Dependencies
        run: |
          if ! command -v javac &> /dev/null || ! command -v verilator &> /dev/null; then
            echo "Dependencies missing, installing default-jdk and verilator..."
            sudo apt-get update
            sudo apt-get install -y default-jdk verilator curl
          else
            echo "System dependencies (Java, Verilator) are already installed."
          fi

      - name: Check and install Mill
        run: |
          if ! command -v mill &> /dev/null; then
            echo "Mill is not installed. Installing..."
            sudo curl -L https://github.com/com-lihaoyi/mill/releases/download/0.11.7/0.11.7 > /usr/local/bin/mill
            sudo chmod +x /usr/local/bin/mill
          else
            echo "Mill is already installed."
          fi

      - name: Run spinalML tests
        env:
          COURSIER_JVM: system
          JAVA_HOME: /usr/lib/jvm/default-java
          JAVA_OPTS: "-Xmx8G"
          MAKEFLAGS: "-j 1"
        run: |
          TARGET_GROUPS="${{ matrix.test_group }}"
          echo "Starting sequential tests for groups: $TARGET_GROUPS"
          
          # Ensure script stops if any test fails
          set -e
          
          for GRP in $TARGET_GROUPS; do
            echo ">>> Processing directory: spinalML/test/src/spinalML/$GRP"
            # Find all .scala files in the current group directory
            TEST_FILES=$(find spinalML/test/src/spinalML/$GRP -name "*.scala")
            
            for FILE in $TEST_FILES; do
              # Extract class name from file name
              CLASS_NAME=$(basename "$FILE" .scala)
              
              echo "=========================================================="
              echo "Running test on LITTLE cores: spinalML.$GRP.$CLASS_NAME"
              echo "=========================================================="
              
              # Run specifically this test class restricted to cores 0, 1, 2, 3 (LITTLE cores)
              taskset -c 0,1,2,3 mill --no-server --disable-ticker spinalML.test.testOnly "spinalML.$GRP.$CLASS_NAME"
              
              echo "Cooling down for 1 second..."
              sleep 1
            done
          done