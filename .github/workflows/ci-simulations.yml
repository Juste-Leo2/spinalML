name: CI - Hardware Simulations

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch: 

jobs:
  build:
    runs-on: [self-hosted, arm64, radxa]
    strategy:
      fail-fast: false
      matrix:
        test_group: [ops, layers, interfaces, examples, tensors, accelerator, activations, poolings]
    steps:
      - uses: actions/checkout@v4

      - name: Check and Install System Dependencies
        run: |
          if ! command -v javac &> /dev/null || ! command -v verilator &> /dev/null; then
            echo "Dependencies missing, installing default-jdk and verilator..."
            sudo apt-get update
            sudo apt-get install -y default-jdk verilator curl
          else
            echo "System dependencies (Java, Verilator) are already installed."
          fi



      - name: Check and Install Mill
        run: |
          if ! command -v mill &> /dev/null; then
            echo "Mill not found in PATH, installing globally..."
            sudo curl -L https://github.com/com-lihaoyi/mill/releases/download/0.11.7/0.11.7-assembly -o /usr/local/bin/mill
            sudo chmod +x /usr/local/bin/mill
          else
            echo "Mill is already installed globally."
          fi

      - name: Run spinalML tests
        env:
          COURSIER_JVM: system
          JAVA_HOME: /usr/lib/jvm/default-java
          JAVA_OPTS: "-Xmx8G"
          MAKEFLAGS: "-j 1"
        run: |
          GROUP="${{ matrix.test_group }}"
          echo "Starting sequential tests for group: $GROUP"
          
          # Find all .scala files in the group directory
          TEST_FILES=$(find spinalML/test/src/spinalML/$GROUP -name "*.scala")
          
          # Ensure script stops if any test fails
          set -e
          
          for FILE in $TEST_FILES; do
            # Extract class name from file name
            CLASS_NAME=$(basename "$FILE" .scala)
            
            echo "=========================================================="
            echo "Running test on LITTLE cores: spinalML.$GROUP.$CLASS_NAME"
            echo "=========================================================="
            
            # Run specifically this test class restricted to cores 0, 1, 2, 3 (LITTLE cores)
            taskset -c 0,1,2,3 mill --no-server --disable-ticker spinalML.test.testOnly "spinalML.$GROUP.$CLASS_NAME"
            
            echo "Cooling down for 1 second..."
            sleep 1
          done