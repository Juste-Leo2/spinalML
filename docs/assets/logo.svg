<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A1E3F"/>
    </linearGradient>

    <pattern id="paraGrid" x="0" y="0" width="35" height="35"
             patternUnits="userSpaceOnUse" patternTransform="skewX(-25)">
      <path d="M 0 0 L 0 35 M 0 0 L 35 0"
            stroke="#00D2FF" stroke-width="1.3" opacity="0.4"/>
    </pattern>

    <radialGradient id="fadeMask" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="white" stop-opacity="1"/>
      <stop offset="65%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridFade">
      <rect width="300" height="300" fill="url(#fadeMask)"/>
    </mask>
  </defs>

  <!-- GRILLE PARALLÉLOGRAMME -->
  <rect width="300" height="300" fill="url(#paraGrid)" mask="url(#gridFade)"/>

  <!-- LE S TYPE PCB (sans bouts arrondis) -->
  <path d="M 210 75
           L 130 75
           Q 95 75, 95 110
           Q 95 150, 130 150
           L 175 150
           Q 210 150, 210 185
           Q 210 225, 175 225
           L 90 225"
        stroke="url(#sGradient)" stroke-width="8" fill="none"
        stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- PADS CARRÉS AUX EXTRÉMITÉS (terminaisons PCB) -->
  <rect x="201" y="66" width="18" height="18" rx="2" fill="url(#sGradient)"/>
  <rect x="81"  y="216" width="18" height="18" rx="2" fill="url(#sGradient)"/>

  <!-- VIAS AUX VIRAGES DU PIPELINE -->
  <circle cx="95"  cy="110" r="3.5" fill="#1E3A8F"/>
  <circle cx="95"  cy="110" r="1.5" fill="#00D2FF" opacity="0.6"/>

  <circle cx="130" cy="150" r="3.5" fill="#1E3A8F"/>
  <circle cx="130" cy="150" r="1.5" fill="#00D2FF" opacity="0.6"/>

  <circle cx="210" cy="185" r="3.5" fill="#1E3A8F"/>
  <circle cx="210" cy="185" r="1.5" fill="#00D2FF" opacity="0.6"/>
</svg>
